<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>도쿄 · 홋카이도 여행 일정표 (모바일)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --indigo:#22335C;
    --indigo-line:#3B4E85;
    --gold:#B8912B;
    --lavender:#7A6BB0;
    --lavender-bg:#F0EDF8;
    --coral:#C4552F;
    --coral-bg:#FBEBE3;
    --paper:#FAF8F3;
    --card:#FFFFFF;
    --ink:#22262F;
    --ink-soft:#6B6F7A;
    --line:#E4E1D6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    padding:0 0 70px;
    font-size:16px;
  }
  .wrap{max-width:600px;margin:0 auto;padding:16px 14px 24px;}

  .quicknav{
    position:sticky;top:0;z-index:20;
    display:flex;gap:6px;overflow-x:auto;
    padding:10px 14px;margin:0 -14px 14px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .quicknav::-webkit-scrollbar{display:none;}
  .quicknav a{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;font-weight:700;
    background:var(--card);border:1px solid var(--line);
    color:var(--indigo);
    padding:8px 12px;border-radius:20px;
    text-decoration:none;white-space:nowrap;
  }

  .hero{
    background:var(--indigo);
    color:#F4F2EA;
    border-radius:16px;
    padding:20px 18px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .hero h1{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:21px;
    margin:0 0 6px;
  }
  .hero .sub{font-size:13px;color:#C7CBE0;margin:0 0 14px;}
  .hero .route{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.3px;
    color:#F4F2EA;
    display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  }
  .hero .route span.stop{
    background:rgba(255,255,255,0.1);
    padding:4px 9px;border-radius:20px;
  }
  .hero .route span.arrow{color:var(--gold);}

  .car-note{
    display:flex;gap:9px;align-items:flex-start;
    background:var(--lavender-bg);
    border:1px solid #DAD3EE;
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.5;
    color:#4A3F72;
    margin-bottom:20px;
  }

  .timeline{position:relative;padding-left:0;}

  .day{
    position:relative;margin-bottom:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    scroll-margin-top:56px;
  }
  .day-head{
    display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
    padding:14px 16px;
    cursor:pointer;user-select:none;
    min-height:44px;
  }
  .day-head .num-badge{
    flex:0 0 auto;
    width:26px;height:26px;border-radius:50%;
    background:var(--gold);color:#22262F;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .day-head .titles{flex:1;min-width:0;}
  .day-head h2{
    font-family:'Noto Serif KR',serif;
    font-size:15.5px;font-weight:700;margin:0;
  }
  .day-head .loc{
    font-size:12px;color:var(--ink-soft);
    margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .day-head .chevron{
    flex:0 0 auto;font-size:14px;color:var(--ink-soft);
    transition:transform .2s;
  }
  .day.collapsed .day-head .chevron{transform:rotate(-90deg);}

  .card{
    background:transparent;
    border:none;
    border-top:1px solid var(--line);
    border-radius:0;
    padding:14px 16px 18px;
  }
  .day.collapsed .card{display:none;}

  .flight{
    display:flex;align-items:center;gap:14px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    background:#F4F1E6;
    border:1px solid #E6E1CE;
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:10px;
    color:#5A4E1F;
  }
  .flight .badge{
    background:var(--gold);color:#2C2308;
    padding:2px 8px;border-radius:6px;font-weight:700;
  }
  .flight .path{flex:1;color:#3A3120;}
  .flight .time{font-weight:700;color:#22262F;}

  .hotel-block, .car-block{
    display:flex;gap:10px;align-items:flex-start;
    border-radius:10px;padding:10px 14px;margin-bottom:10px;
    font-size:12.5px;
  }
  .hotel-block{background:var(--lavender-bg);border:1px solid #DAD3EE;}
  .car-block{background:#EAF3E4;border:1px solid #CFE5C3;}
  .hotel-block .tag, .car-block .tag{
    font-family:'JetBrains Mono',monospace;font-weight:700;
    padding:2px 8px;border-radius:6px;white-space:nowrap;
  }
  .hotel-block .tag{background:var(--lavender);color:#fff;}
  .car-block .tag{background:#4E7A3A;color:#fff;}
  .hotel-block .info b, .car-block .info b{display:block;font-size:13px;color:#22262F;}
  .hotel-block .info span, .car-block .info span{color:#5A5470;}
  .item-map-link{
    flex-shrink:0;font-size:16px;text-decoration:none;
    padding:4px 7px;border-radius:6px;align-self:center;
  }

  .list{list-style:none;margin:0;padding:0;}
  .list li.item-row{
    position:relative;
    padding:9px 0;border-bottom:1px solid var(--line);
  }
  .list li.item-row:last-child{border-bottom:none;}
  .item-main{display:flex;align-items:center;gap:6px;}
  .list .t{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    color:var(--ink-soft);min-width:42px;max-width:60px;flex-shrink:0;
    outline:none;border-radius:6px;padding:4px;
  }
  .list .t:focus{background:#F5F3EA;color:var(--ink);}
  .list .txt{
    flex:1;min-width:0;outline:none;font-size:14.5px;line-height:1.5;
    border-radius:6px;padding:4px 6px;margin:0 -6px;
  }
  .list .txt:focus{background:#F5F3EA;}
  .pin-btn{
    flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:16px;
    padding:4px 6px;border-radius:6px;
  }
  .more-btn{
    flex-shrink:0;border:none;background:none;color:var(--ink-soft);
    font-size:18px;line-height:1;padding:4px 8px;min-width:32px;
  }
  .item-more-row{
    position:absolute;top:calc(100% - 2px);right:8px;z-index:30;
    display:flex;flex-direction:column;gap:1px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 18px rgba(34,38,47,0.14);
    padding:4px;min-width:150px;
  }
  .item-more-row[hidden]{display:none;}
  .item-more-row button{
    border:none;background:none;color:var(--ink);text-align:left;
    font-size:13px;border-radius:7px;padding:9px 10px;min-height:38px;
    white-space:nowrap;
  }
  .item-more-row button:active{background:var(--paper);}
  .item-more-row button:disabled{opacity:0.35;}
  .item-more-row .del{color:var(--coral);}
  .item-link-row{margin-top:6px;}
  .item-link-row .link-input{
    width:100%;box-sizing:border-box;font-size:13px;color:var(--ink);
    outline:none;border:1px dashed var(--line);border-radius:8px;
    padding:8px 10px;background:#FAFAF6;
  }
  .item-link-row .link-input:focus{background:#F5F3EA;border-style:solid;}

  .add-row{display:flex;gap:8px;margin-top:12px;}
  .add-row input[type=text]{
    font-family:'JetBrains Mono',monospace;font-size:13px;width:64px;
    border:1px solid var(--line);border-radius:8px;padding:9px 8px;
  }
  .add-row input[type=text].name{
    font-family:'Noto Sans KR',sans-serif;font-size:14px;flex:1;width:auto;
  }
  .add-row button{
    border:1px solid var(--indigo-line);background:var(--indigo);color:#fff;
    border-radius:8px;padding:9px 16px;font-size:13px;min-height:40px;
  }

  .day-todo{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .day-todo-title{font-size:12.5px;font-weight:700;color:var(--indigo);margin-bottom:8px;}
  .day-todo-list{list-style:none;margin:0;padding:0;}
  .day-todo-list li{
    display:flex;align-items:flex-start;gap:9px;
    padding:8px 0;border-bottom:1px solid var(--line);
  }
  .day-todo-list li:last-child{border-bottom:none;}
  .day-todo-list input[type=checkbox]{
    margin-top:2px;width:19px;height:19px;accent-color:var(--indigo);flex-shrink:0;
  }
  .day-todo-list .dtxt{
    flex:1;outline:none;font-size:14px;line-height:1.5;
    border-radius:6px;padding:3px 6px;margin:-3px -6px;
  }
  .day-todo-list .dtxt:focus{background:#F5F3EA;}
  .day-todo-list li.done .dtxt{color:var(--ink-soft);text-decoration:line-through;}
  .day-todo-list .del{
    border:none;background:none;color:#BDBAAE;font-size:16px;padding:4px 8px;min-width:32px;
  }
  .day-todo-add{display:flex;gap:8px;margin-top:10px;}
  .day-todo-add input[type=text]{
    font-family:'Noto Sans KR',sans-serif;font-size:14px;flex:1;
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  }
  .day-todo-add button{
    border:1px solid var(--indigo-line);background:var(--indigo);color:#fff;
    border-radius:8px;padding:9px 16px;font-size:13px;min-height:40px;
  }

  .save{
    position:fixed;bottom:18px;right:24px;
    font-size:11px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);
    padding:6px 12px;border-radius:20px;opacity:0;transition:opacity .3s;
  }
  .save.show{opacity:1;}

  .todo-section{margin-bottom:32px;}
  .todo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer;user-select:none;}
  .todo-head .left{display:flex;align-items:center;gap:8px;}
  .todo-head h2{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;margin:0;}
  .todo-chevron{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;color:var(--ink-soft);
    transition:transform .2s;font-size:12px;
  }
  .todo-chevron.collapsed{transform:rotate(-90deg);}
  .todo-progress{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .todo-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;}
  .todo-card.collapsed{display:none;}
  .todo-cat-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:14px 0 6px;gap:8px;
  }
  .todo-cat-head:first-child{margin-top:0;}
  .todo-cat{
    font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:0.5px;
    outline:none;border-radius:4px;padding:2px 4px;margin:-2px -4px;flex:1;
  }
  .todo-cat:focus{background:#F8F3E4;}
  .todo-cat-del{
    border:none;background:none;color:#D8D4C4;cursor:pointer;font-size:12px;padding:0 4px;
  }
  .todo-cat-del:hover{color:var(--coral);}
  .todo-list{list-style:none;margin:0;padding:0;}
  .todo-list li{
    display:flex;align-items:flex-start;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line);
  }
  .todo-list li:last-child{border-bottom:none;}
  .todo-list input[type=checkbox]{
    margin-top:2px;width:19px;height:19px;accent-color:var(--indigo);flex-shrink:0;
  }
  .todo-list .txt2{
    flex:1;outline:none;font-size:14px;line-height:1.5;
    border-radius:6px;padding:3px 6px;margin:-3px -6px;
  }
  .todo-list .txt2:focus{background:#F5F3EA;}
  .todo-list li.done .txt2{color:var(--ink-soft);text-decoration:line-through;}
  .todo-list .del{
    border:none;background:none;color:#BDBAAE;font-size:16px;padding:4px 8px;min-width:32px;
  }
  .todo-add-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .todo-add-row select{
    font-family:'Noto Sans KR',sans-serif;font-size:13px;
    border:1px solid var(--line);border-radius:8px;padding:8px;
    flex:1 1 100%;
  }
  .todo-add-row input[type=text]{
    font-family:'Noto Sans KR',sans-serif;font-size:14px;flex:1;
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  }
  .todo-add-row button{
    border:1px solid var(--indigo-line);background:var(--indigo);color:#fff;
    border-radius:8px;padding:9px 16px;font-size:13px;min-height:40px;
  }
  .todo-add-cat-row{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .todo-add-cat-row input[type=text]{
    font-family:'Noto Sans KR',sans-serif;font-size:14px;flex:1;
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  }
  .todo-add-cat-row button{
    border:1px solid var(--lavender);background:var(--lavender-bg);color:#4A3F72;
    border-radius:8px;padding:9px 14px;font-size:12.5px;min-height:40px;
  }
</style>
</head>

<div class="wrap">

  <div class="quicknav">

    <div class="todo-card" id="todo-card"></div>
  </div>

  <div class="timeline" id="timeline"></div>
</div>

const todoCard = document.getElementById('todo-card');
const todoProgress = document.getElementById('todo-progress');
const todoHead = document.getElementById('todo-head');
const todoChevron = document.getElementById('todo-chevron');

async function persistTodos(){
  try{
    await storageAPI.set('itinerary_todos', JSON.stringify({categories: todoCategories, items: todos, collapsed: todoCollapsed}), false);
    flashSave();
  }catch(e){ console.error('todo save failed', e); }
}

async function loadTodos(){
  const defaultCategories = todoCategories.slice();
  const defaultTodos = todos.slice();
  try{
    const res = await storageAPI.get('itinerary_todos', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && Array.isArray(parsed.items) && Array.isArray(parsed.categories)){
        todos = parsed.items;
        todoCategories = parsed.categories;
        todoCollapsed = !!parsed.collapsed;
        defaultCategories.forEach(c=>{ if(!todoCategories.includes(c)) todoCategories.push(c); });
        defaultTodos.forEach(dt=>{
          if(!todos.some(t=> t.t === dt.t)) todos.push(dt);
        });
      }
    }
  }catch(e){ /* no saved todos yet, use defaults */ }
}

function applyCollapsedState(){
  todoCard.classList.toggle('collapsed', todoCollapsed);
  todoChevron.classList.toggle('collapsed', todoCollapsed);
}

todoHead.addEventListener('click', ()=>{
  todoCollapsed = !todoCollapsed;
  applyCollapsedState();
  persistTodos();
});

function renderTodos(){
  const done = todos.filter(x=>x.done).length;
  todoProgress.textContent = `${done} / ${todos.length} 완료`;
  applyCollapsedState();

  let html = '';
  todoCategories.forEach((cat, ci)=>{
    const items = todos.map((x,i)=>({...x,idx:i})).filter(x=>x.cat===cat);
    html += `<div class="todo-cat-head">
      <span class="todo-cat" contenteditable="true" data-cat-idx="${ci}">${cat}</span>
      <button class="todo-cat-del" data-cat-idx="${ci}" aria-label="카테고리 삭제">카테고리 삭제 ✕</button>
    </div><ul class="todo-list">`;
    items.forEach(it=>{
      html += `<li class="${it.done?'done':''}">
        <input type="checkbox" data-idx="${it.idx}" ${it.done?'checked':''}>
        <span class="txt2" contenteditable="true" data-idx="${it.idx}">${it.t}</span>
        <button class="del" data-idx="${it.idx}" aria-label="삭제">✕</button>
      </li>`;
    });
    if(!items.length){
      html += `<li style="color:var(--ink-soft);font-size:13px;">항목 없음</li>`;
    }
    html += `</ul>`;
  });

  html += `<div class="todo-add-row">
    <select id="todo-cat-select">${todoCategories.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    <input type="text" id="todo-new-input" placeholder="준비할 항목 추가...">
    <button id="todo-add-btn">추가</button>
  </div>
  <div class="todo-add-cat-row">
    <input type="text" id="todo-new-cat-input" placeholder="새 카테고리 이름...">
    <button id="todo-add-cat-btn">카테고리 추가</button>
  </div>`;

  todoCard.innerHTML = html;

  todoCard.querySelectorAll('input[type=checkbox]').forEach(el=>{
    el.addEventListener('change', e=>{
      const i = +e.target.dataset.idx;
      todos[i].done = e.target.checked;
      persistTodos();
      renderTodos();
    });
  });
  todoCard.querySelectorAll('.txt2').forEach(el=>{
    el.addEventListener('blur', e=>{
      const i = +e.target.dataset.idx;
      todos[i].t = e.target.textContent.trim();
      persistTodos();
    });
  });
  todoCard.querySelectorAll('.del').forEach(el=>{
    el.addEventListener('click', e=>{
      const i = +e.target.dataset.idx;
      todos.splice(i,1);
      persistTodos();
      renderTodos();
    });
  });
  todoCard.querySelectorAll('.todo-cat').forEach(el=>{
    el.addEventListener('blur', e=>{
      const ci = +e.target.dataset.catIdx;
      const oldName = todoCategories[ci];
      const newName = e.target.textContent.trim();
      if(newName && newName !== oldName){
        todoCategories[ci] = newName;
        todos.forEach(t=>{ if(t.cat === oldName) t.cat = newName; });
        persistTodos();
        renderTodos();
      }
    });
  });
  todoCard.querySelectorAll('.todo-cat-del').forEach(el=>{
    el.addEventListener('click', e=>{
      const ci = +e.target.dataset.catIdx;
      const catName = todoCategories[ci];
      const hasItems = todos.some(t=>t.cat===catName);
      if(hasItems && !confirm(`"${catName}" 카테고리에 항목이 있어요. 카테고리와 그 안의 모든 항목을 삭제할까요?`)) return;
      todoCategories.splice(ci,1);
      todos = todos.filter(t=>t.cat!==catName);
      persistTodos();
      renderTodos();
    });
  });
  const addBtn = document.getElementById('todo-add-btn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      const sel = document.getElementById('todo-cat-select');
      const input = document.getElementById('todo-new-input');
      if(input.value.trim()){
        todos.push({cat: sel.value, t: input.value.trim(), done:false});
        persistTodos();
        renderTodos();
      }
    });
  }
  const addCatBtn = document.getElementById('todo-add-cat-btn');
  if(addCatBtn){
    addCatBtn.addEventListener('click', ()=>{
      const input = document.getElementById('todo-new-cat-input');
      const name = input.value.trim();
      if(name && !todoCategories.includes(name)){
        todoCategories.push(name);
        persistTodos();
        renderTodos();
      }
    });
  }
}

// Firebase Firestore가 있으면 실시간 동기화, 없으면(오프라인 등)
// Claude 아티팩트의 window.storage 또는 localStorage로 자동 대체
const storageAPI = {
  async get(key, shared=false){
    if(db){
      try{
        const snap = await getDoc(doc(db, 'trip', key));
        if(snap.exists()) return {key, value: snap.data().value, shared};
        return null;
      }catch(e){ console.error('firestore get failed', e); }
    }
    if(window.storage){ return window.storage.get(key, shared); }
    try{
      const v = localStorage.getItem(key);
      return v !== null ? {key, value:v, shared} : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared=false){
    if(db){
      try{
        await setDoc(doc(db, 'trip', key), {value, updatedAt: Date.now()});
        return {key, value, shared};
      }catch(e){ console.error('firestore set failed', e); }
    }
    if(window.storage){ return window.storage.set(key, value, shared); }
    try{
      localStorage.setItem(key, value);
      return {key, value, shared};
    }catch(e){ return null; }
  }
};

function flashSave(){
  saveEl.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveEl.classList.remove('show'),1200);
}

const ITINERARY_VERSION = 7;

async function persist(){
  try{
    await storageAPI.set('itinerary_days', JSON.stringify({version: ITINERARY_VERSION, days}), false);
    flashSave();
  }catch(e){ console.error('save failed', e); }
}

async function loadPersisted(){
  try{
    const res = await storageAPI.get('itinerary_days', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.version === ITINERARY_VERSION && Array.isArray(parsed.days) && parsed.days.length === days.length){
        parsed.days.forEach((d,i)=>{
          days[i].items = d.items;
          if(Array.isArray(d.dayTodos)) days[i].dayTodos = d.dayTodos;
        });
      }
    }
  }catch(e){ /* no saved data yet */ }
}

    if(day.hotel){
      const hMapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(day.hotel.name) + (day.hotel.pid ? '&query_place_id=' + day.hotel.pid : '');
      hotelHtml = `<div class="hotel-block"><span class="tag">숙소</span><div class="info"><b>${day.hotel.name}</b><span>${day.hotel.addr} · ${day.hotel.inout}</span></div><a class="item-map-link" href="${hMapUrl}" target="_blank" rel="noopener" title="구글맵에서 보기">${day.hotel.pid?'📍':'🗺️'}</a></div>`;
    }
    let carHtml = '';
    if(day.car){
      carHtml = `<div class="car-block"><span class="tag">차량${day.car.event}</span><div class="info"><b>${day.car.co}</b><span>${day.car.place} · ${day.car.time}</span></div></div>`;
    }

    let itemsHtml = '';
    day.items.forEach((it, ii)=>{
      itemsHtml += `<li class="item-row">
        <div class="item-main">
          <span class="t" contenteditable="true" data-day="${di}" data-item="${ii}">${it.t}</span>
          <span class="txt" contenteditable="true" data-day="${di}" data-item="${ii}">${it.x}</span>
          ${it.url ? `<a class="pin-btn added" href="${it.url}" target="_blank" rel="noopener" title="구글맵에서 보기">📍</a>` : ''}
          <button class="more-btn" data-day="${di}" data-item="${ii}" title="더보기">⋯</button>
        </div>
        <div class="item-more-row" hidden>
          <button class="move-up" data-day="${di}" data-item="${ii}" ${ii===0?'disabled':''}>▲ 위로</button>
          <button class="move-down" data-day="${di}" data-item="${ii}" ${ii===day.items.length-1?'disabled':''}>▼ 아래로</button>
          <button class="link-btn" data-day="${di}" data-item="${ii}">🔗 ${it.url?'링크 수정':'구글맵 링크 추가'}</button>
          <button class="del" data-day="${di}" data-item="${ii}">✕ 삭제</button>
        </div>
        <div class="item-link-row" hidden>
          <input type="text" class="link-input" data-day="${di}" data-item="${ii}"
            placeholder="구글맵에서 복사한 링크를 붙여넣기" value="${it.url ? it.url.replace(/"/g,'&quot;') : ''}">
        </div>
      </li>`;
    });

    let dayTodoHtml = '';
    (day.dayTodos || []).forEach((dt, ti)=>{
      dayTodoHtml += `<li class="${dt.done?'done':''}">
        <input type="checkbox" data-day="${di}" data-tidx="${ti}" ${dt.done?'checked':''}>
        <span class="dtxt" contenteditable="true" data-day="${di}" data-tidx="${ti}">${dt.t}</span>
        <button class="del-dt" data-day="${di}" data-tidx="${ti}" aria-label="삭제">✕</button>
      </li>`;
    });

    el.innerHTML = `
      <div class="day-head" data-toggle="${di}">
        <span class="num-badge">${day.num}</span>
        <div class="titles">
          <h2>Day ${day.num} · ${day.date}</h2>
          <div class="loc">${day.loc}</div>
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="card">
        ${flightsHtml}
        ${hotelHtml}
        ${carHtml}
        <ul class="list">${itemsHtml}</ul>
        <div class="add-row">
          <input type="text" class="time-in" placeholder="시간" data-day="${di}">
          <input type="text" class="name" placeholder="일정 추가... (장소명도 여기에)" data-day="${di}">
          <button data-day="${di}" class="add-btn">추가</button>
        </div>
        <div class="day-todo">
          <div class="day-todo-title">📌 이 날 해야 할 일</div>
          <ul class="day-todo-list">${dayTodoHtml}</ul>
          <div class="day-todo-add">
            <input type="text" class="dt-new-input" placeholder="할 일 추가..." data-day="${di}">
            <button class="dt-add-btn" data-day="${di}">추가</button>
          </div>
        </div>
      </div>
    `;
    timeline.appendChild(el);
  });

  document.querySelectorAll('.day-head').forEach(el=>{
    el.addEventListener('click', e=>{
      el.closest('.day').classList.toggle('collapsed');
    });
  });

  document.querySelectorAll('.quicknav a').forEach(a=>{
    a.addEventListener('click', e=>{
      const targetEl = document.querySelector(a.getAttribute('href'));
      if(targetEl) targetEl.classList.remove('collapsed');
    });
  });

  document.querySelectorAll('.txt').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      days[d].items[i].x = e.target.textContent.trim();
      persist();
    });
  });
  document.querySelectorAll('.list .t').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      days[d].items[i].t = e.target.textContent.trim();
      persist();
    });
  });
  document.querySelectorAll('.day-todo-list input[type=checkbox]').forEach(el=>{
    el.addEventListener('change', e=>{
      const d = +e.target.dataset.day, ti = +e.target.dataset.tidx;
      days[d].dayTodos[ti].done = e.target.checked;
      persist();
      render();
    });
  });
  document.querySelectorAll('.dtxt').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, ti = +e.target.dataset.tidx;
      days[d].dayTodos[ti].t = e.target.textContent.trim();
      persist();
    });
  });
  document.querySelectorAll('.del-dt').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day, ti = +e.currentTarget.dataset.tidx;
      days[d].dayTodos.splice(ti,1);
      persist();
      render();
    });
  });
  document.querySelectorAll('.dt-add-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day;
      const input = document.querySelector(`.dt-new-input[data-day="${d}"]`);
      if(input.value.trim()){
        if(!days[d].dayTodos) days[d].dayTodos = [];
        days[d].dayTodos.push({t: input.value.trim(), done:false});
        persist();
        render();
      }
    });
  });

  document.querySelectorAll('.more-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const row = e.currentTarget.closest('.item-row').querySelector('.item-more-row');
      const isHidden = row.hidden;
      document.querySelectorAll('.item-more-row').forEach(r=>{ r.hidden = true; });
      row.hidden = !isHidden;
    });
  });
  document.querySelectorAll('.link-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const itemRow = e.currentTarget.closest('.item-row');
      itemRow.querySelector('.item-more-row').hidden = true;
      const linkRow = itemRow.querySelector('.item-link-row');
      linkRow.hidden = false;
      linkRow.querySelector('.link-input').focus();
    });
  });
  document.querySelectorAll('.link-input').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      const val = e.target.value.trim();
      if(val){
        days[d].items[i].url = val;
      } else {
        delete days[d].items[i].url;
      }
      persist();
      render();
    });
  });

  document.querySelectorAll('.move-up').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day, i = +e.currentTarget.dataset.item;
      if(i>0){
        const arr = days[d].items;
        [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
        persist();
        render();
      }
    });
  });
  document.querySelectorAll('.move-down').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day, i = +e.currentTarget.dataset.item;
      const arr = days[d].items;
      if(i<arr.length-1){
        [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
        persist();
        render();
      }
    });
  });
  document.querySelectorAll('.del').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      days[d].items.splice(i,1);
      persist();
      render();
    });
  });
  document.querySelectorAll('.add-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.target.dataset.day;
      const row = e.target.closest('.add-row');
      const timeIn = row.querySelector('.time-in');
      const nameIn = row.querySelector('.name');
      if(nameIn.value.trim()){
        days[d].items.push({t: timeIn.value.trim() || '-', x: nameIn.value.trim()});
        persist();
        render();
      }
    });
  });
  document.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day;
      const place = e.currentTarget.dataset.place;
      days[d].items.push({t:'-', x: place});
      persist();
      render();
    });
  });
}

function setupRealtimeSync(){
  if(!db) return;
  let ignoreNextDays = false;
  let ignoreNextTodos = false;

  onSnapshot(doc(db, 'trip', 'itinerary_days'), (snap)=>{
    if(!snap.exists()) return;
    try{
      const parsed = JSON.parse(snap.data().value);
      if(parsed && parsed.version === ITINERARY_VERSION && Array.isArray(parsed.days) && parsed.days.length === days.length){
        const anyMenuOpen = !!document.querySelector('.item-more-row:not([hidden])');
        if(anyMenuOpen) return; // avoid disrupting an open menu mid-interaction
        parsed.days.forEach((d,i)=>{
          days[i].items = d.items;
          if(Array.isArray(d.dayTodos)) days[i].dayTodos = d.dayTodos;
        });
        render();
      }
    }catch(e){ /* ignore malformed remote data */ }
  });

  onSnapshot(doc(db, 'trip', 'itinerary_todos'), (snap)=>{
    if(!snap.exists()) return;
    try{
      const parsed = JSON.parse(snap.data().value);
      if(parsed && Array.isArray(parsed.items) && Array.isArray(parsed.categories)){
        todos = parsed.items;
        todoCategories = parsed.categories;
        todoCollapsed = !!parsed.collapsed;
        renderTodos();
      }
    }catch(e){ /* ignore malformed remote data */ }
  });
}

document.addEventListener('click', ()=>{
  document.querySelectorAll('.item-more-row').forEach(r=>{ r.hidden = true; });
});

(async ()=>{
  await loadPersisted();
  render();
  await loadTodos();
  renderTodos();
  setupRealtimeSync();
})();
</script>
</body>
</html>
