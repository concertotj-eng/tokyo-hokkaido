<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>도쿄 · 홋카이도 여행 일정표 (모바일)</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --indigo:#22335C;
    --indigo-line:#3B4E85;
    --gold:#B8912B;
    --lavender:#7A6BB0;
    --lavender-bg:#F0EDF8;
    --coral:#C4552F;
    --coral-bg:#FBEBE3;
    --paper:#FAF8F3;
    --card:#FFFFFF;
    --ink:#22262F;
    --ink-soft:#6B6F7A;
    --line:#E4E1D6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    padding:0 0 70px;
    font-size:16px;
  }
  .wrap{max-width:600px;margin:0 auto;padding:16px 14px 24px;}

  .quicknav{
    position:sticky;top:0;z-index:20;
    display:flex;gap:5px;overflow-x:auto;
    padding:7px 14px;margin:0 -14px 10px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .quicknav::-webkit-scrollbar{display:none;}
  .quicknav a{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:700;
    background:var(--card);border:1px solid var(--line);
    color:var(--indigo);
    padding:6px 10px;border-radius:20px;
    text-decoration:none;white-space:nowrap;
  }

  .hero{
    background:var(--indigo);
    color:#F4F2EA;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    position:relative;
    overflow:hidden;
  }
  .hero h1{
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    font-weight:800;
    letter-spacing:-0.3px;
    font-size:18px;
    margin:0 0 4px;
  }
  .hero .sub{font-size:12px;color:#C7CBE0;margin:0 0 9px;}
  .hero .route{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.3px;
    color:#F4F2EA;
    display:flex;flex-wrap:wrap;gap:4px;align-items:center;
  }
  .hero .route span.stop{
    background:rgba(255,255,255,0.1);
    padding:3px 8px;border-radius:20px;
  }
  .hero .route span.arrow{color:var(--gold);}

  .car-note{
    display:flex;gap:8px;align-items:flex-start;
    background:var(--lavender-bg);
    border:1px solid #DAD3EE;
    border-radius:10px;
    padding:9px 12px;
    font-size:12px;
    line-height:1.45;
    color:#4A3F72;
    margin-bottom:12px;
  }

  .timeline{position:relative;padding-left:0;}

  .day{
    position:relative;margin-bottom:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    scroll-margin-top:52px;
  }
  .day-head{
    display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
    padding:12px 14px;
    cursor:pointer;user-select:none;
    min-height:44px;
    -webkit-tap-highlight-color:rgba(34,51,92,0.06);
    transition:background-color .1s;
  }
  .day-head:active{background-color:#F3F2EC;}
  .day-head .num-badge{
    flex:0 0 auto;
    width:22px;height:22px;border-radius:50%;
    background:var(--gold);color:#22262F;
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .day-head .titles{flex:1;min-width:0;}
  .day-head h2{
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    font-size:14px;font-weight:800;letter-spacing:-0.2px;margin:0;
  }
  .day-head .loc{
    font-size:11px;color:var(--ink-soft);
    margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .day-date, .day-loc{outline:none;border-radius:4px;padding:0 2px;margin:0 -2px;}
  .day-date[contenteditable="true"], .day-loc[contenteditable="true"]{background:#F5F3EA;color:var(--ink);}
  .day-loc[contenteditable="true"]{white-space:normal;text-overflow:clip;}
  .edit-head-btn{
    flex:0 0 auto;border:none;background:none;font-size:13px;
    padding:4px 6px;opacity:0.55;
  }
  .edit-head-btn:active{opacity:1;}
  .day-head .chevron{
    flex:0 0 auto;
    width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--indigo);background:#EFEDE3;
    transition:transform .2s;
  }
  .day.collapsed .day-head .chevron{transform:rotate(-90deg);}

  .card{
    background:transparent;
    border:none;
    border-top:1px solid var(--line);
    border-radius:0;
    padding:10px 14px 12px;
  }
  .day.collapsed .card{display:none;}

  .flight{
    display:flex;align-items:center;gap:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    background:#F4F1E6;
    border:1px solid #E6E1CE;
    border-radius:8px;
    padding:7px 10px;
    margin-bottom:6px;
    color:#5A4E1F;
  }
  .flight .badge{
    background:var(--gold);color:#2C2308;
    padding:1px 6px;border-radius:5px;font-weight:700;
  }
  .flight .path{flex:1;color:#3A3120;}
  .flight .time{font-weight:700;color:#22262F;}

  .hotel-block, .car-block{
    display:flex;gap:8px;align-items:center;
    border-radius:8px;padding:7px 10px;margin-bottom:6px;
    font-size:11.5px;
  }
  .hotel-block{background:var(--lavender-bg);border:1px solid #DAD3EE;}
  .car-block{background:#EAF3E4;border:1px solid #CFE5C3;}
  .hotel-block .tag, .car-block .tag{
    font-family:'JetBrains Mono',monospace;font-weight:700;
    padding:1px 6px;border-radius:5px;white-space:nowrap;
  }
  .hotel-block .tag{background:var(--lavender);color:#fff;}
  .car-block .tag{background:#4E7A3A;color:#fff;}
  .hotel-block .info, .car-block .info{min-width:0;flex:1;}
  .hotel-block .info b, .car-block .info b{display:block;font-size:12px;color:#22262F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hotel-block .info span, .car-block .info span{color:#5A5470;font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-map-link{
    flex-shrink:0;font-size:15px;text-decoration:none;
    padding:2px 5px;border-radius:6px;align-self:center;
  }

  .list{list-style:none;margin:0;padding:0;}
  .list li.item-row{
    position:relative;
    padding:5px 0;border-bottom:1px solid var(--line);
  }
  .list li.item-row:last-child{border-bottom:none;}
  .item-main{display:flex;align-items:center;gap:6px;}
  .list .t{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;
    color:var(--ink-soft);min-width:42px;max-width:60px;flex-shrink:0;
    outline:none;border-radius:6px;padding:4px;
  }
  .list .t:focus{background:#F5F3EA;color:var(--ink);}
  .list .txt{
    flex:1;min-width:0;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.3;
    border-radius:6px;padding:4px 6px;margin:0 -6px;
  }
  .list .txt:focus{background:#F5F3EA;}
  .map-badge{
    flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:15px;
    padding:3px 5px;border-radius:6px;
  }
  .cost-badge{
    flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    color:#8A6D1E;background:#F7EFD8;border:1px solid #E9D9A8;
    border-radius:12px;padding:3px 8px;white-space:nowrap;
  }
  .more-btn{
    flex-shrink:0;border:none;background:none;color:var(--ink-soft);
    font-size:18px;line-height:1;padding:4px 8px;min-width:32px;
  }
  .item-more-row{
    position:absolute;top:calc(100% - 2px);right:8px;z-index:30;
    display:flex;flex-direction:column;gap:1px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 18px rgba(34,38,47,0.14);
    padding:4px;min-width:170px;
  }
  .item-more-row[hidden]{display:none;}
  .item-more-row button{
    border:none;background:none;color:var(--ink);text-align:left;
    font-size:13px;border-radius:7px;padding:9px 10px;min-height:38px;
    white-space:nowrap;
  }
  .item-more-row button:active{background:var(--paper);}
  .item-more-row button:disabled{opacity:0.35;}
  .item-more-row .del{color:var(--coral);}
  .item-link-row{margin-top:6px;}
  .item-link-row .link-input{
    width:100%;box-sizing:border-box;font-size:13px;color:var(--ink);
    outline:none;border:1px dashed var(--line);border-radius:8px;
    padding:8px 10px;background:#FAFAF6;
  }
  .item-link-row .link-input:focus{background:#F5F3EA;border-style:solid;}

  .item-cost-row{margin-top:6px;display:flex;gap:6px;}
  .item-cost-row .cost-input{
    flex:1;box-sizing:border-box;font-size:14px;color:var(--ink);
    outline:none;border:1px dashed var(--line);border-radius:8px;
    padding:8px 10px;background:#FAFAF6;font-family:'JetBrains Mono',monospace;
  }
  .item-cost-row .cost-input:focus{background:#F5F3EA;border-style:solid;}
  .item-cost-row .cost-cur{
    border:1px dashed var(--line);background:#FAFAF6;color:var(--ink-soft);
    border-radius:8px;padding:8px 10px;font-size:12.5px;white-space:nowrap;
  }
  .hotel-cost-btn, .car-cost-btn, .flight-cost-btn{
    flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    border:none;border-radius:12px;padding:3px 8px;white-space:nowrap;
    background:rgba(255,255,255,0.6);color:#4A3F72;
  }
  .flight-cost-btn{background:rgba(0,0,0,0.06);color:#5A4E1F;margin-left:auto;}
  .hotel-cost-row, .flight-cost-row, .car-cost-row{margin-top:6px;padding:0 2px;display:flex;gap:6px;}
  .hotel-cost-row input[type=number], .flight-cost-row input[type=number], .car-cost-row input[type=number]{
    flex:1;box-sizing:border-box;font-size:13px;color:var(--ink);
    outline:none;border:1px dashed var(--line);border-radius:8px;
    padding:7px 9px;background:#FAFAF6;font-family:'JetBrains Mono',monospace;
  }
  .hotel-cost-cur, .flight-cost-cur, .car-cost-cur{
    border:1px dashed var(--line);background:#FAFAF6;color:var(--ink-soft);
    border-radius:8px;padding:7px 10px;font-size:12.5px;
  }
  .hotel-equiv{
    margin-top:2px;font-size:10.5px;color:#8A6D1E;
    font-family:'JetBrains Mono',monospace;
  }

  .cost-section-label{
    font-size:11px;font-weight:800;color:var(--indigo);text-transform:uppercase;
    letter-spacing:0.4px;margin:0 0 6px;
  }

  .cost-grand-box{
    display:flex;justify-content:space-between;align-items:baseline;
    background:var(--indigo);color:#fff;
    border-radius:10px;padding:12px 14px;margin-bottom:12px;
  }
  .cost-grand-label{font-size:12px;font-weight:700;opacity:0.85;}
  .cost-grand-amt{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;}

  .cost-cat-block{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .cost-cat-head{
    width:100%;display:flex;align-items:center;gap:8px;
    border:none;background:var(--card);padding:10px 12px;text-align:left;
  }
  .cost-cat-title{font-size:13px;font-weight:700;color:var(--ink);flex:1;}
  .cost-cat-amt{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--ink);}
  .cost-cat-chevron{font-size:11px;color:var(--ink-soft);transition:transform .15s;}
  .cost-cat-chevron.open{transform:rotate(180deg);}
  .cost-cat-detail{padding:0 12px 10px;background:#FAFAF7;}

  .cost-empty-day{color:var(--ink-soft);font-size:11.5px;padding:8px 2px;}

  .cost-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .cost-table td{padding:5px 2px;border-bottom:1px dotted var(--line);vertical-align:top;}
  .cost-table tr:last-child td{border-bottom:none;}
  .cost-table .c-label{color:var(--ink);}
  .cost-table .c-amt{text-align:right;font-family:'JetBrains Mono',monospace;white-space:nowrap;padding-right:6px;}
  .cost-table .c-x{width:20px;text-align:right;}
  .cost-table .del-extra{border:none;background:none;color:#BDBAAE;font-size:13px;padding:2px 4px;}
  .cost-table .c-equiv-row td{color:var(--ink-soft);font-size:10.5px;font-style:italic;border-bottom-style:dotted;}

  .cost-add-section{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .cost-add-form{display:flex;flex-direction:column;gap:6px;}
  .cost-add-form input,
  .cost-add-form select,
  .cost-add-form button{
    height:38px;box-sizing:border-box;font-size:12.5px;
    border:1px dashed var(--line);border-radius:8px;background:#FAFAF6;color:var(--ink);
  }
  .cost-add-row-1{display:grid;grid-template-columns:64px 1fr;gap:6px;}
  .cost-add-form .extra-day{padding:0 6px;color:var(--ink-soft);}
  .cost-add-form .extra-label{padding:0 10px;}
  .cost-add-row-2{display:grid;grid-template-columns:36px 1fr 56px;gap:6px;}
  .cost-add-row-2 .extra-cur{color:var(--ink-soft);font-weight:700;}
  .cost-add-row-2 .extra-amount{
    font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;
    text-align:right;padding:0 8px;
  }
  .cost-add-row-2 .extra-add-btn{
    border:1px solid var(--indigo-line);background:var(--indigo);color:#fff;font-weight:700;
  }

  .add-row{display:flex;gap:6px;margin-top:8px;}
  .add-row input[type=text]{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;width:56px;
    border:1px solid var(--line);border-radius:7px;padding:7px 6px;
  }
  .add-row input[type=text].name{
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;flex:1;width:auto;
  }
  .add-row button{
    border:1px solid var(--indigo-line);background:var(--indigo);color:#fff;
    border-radius:7px;padding:7px 14px;font-size:12.5px;min-height:36px;
  }

  .day-todo{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .day-todo-title{
    font-family:'Noto Sans KR',sans-serif;
    font-size:11px;font-weight:700;color:var(--indigo);
    text-transform:uppercase;letter-spacing:0.4px;
    margin-bottom:4px;
  }
  .day-todo-list{list-style:none;margin:0;padding:0;}
  .day-todo-list li{
    display:flex;align-items:flex-start;gap:8px;
    padding:4px 0;border-bottom:1px solid var(--line);
  }
  .day-todo-list li:last-child{border-bottom:none;}
  .day-todo-list input[type=checkbox]{
    margin-top:2px;width:17px;height:17px;accent-color:var(--indigo);flex-shrink:0;
  }
  .day-todo-list .dtxt{
    flex:1;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.3;
    border-radius:6px;padding:2px 6px;margin:-2px -6px;
  }
  .day-todo-list .dtxt:focus{background:#F5F3EA;}
  .day-todo-list li.done .dtxt{color:var(--ink-soft);text-decoration:line-through;}
  .day-todo-list .del{
    border:none;background:none;color:#BDBAAE;font-size:15px;padding:2px 6px;min-width:28px;
  }
  .day-todo-add{display:flex;gap:6px;margin-top:6px;}
  .day-todo-add input[type=text]{
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;flex:1;
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;
  }
  .day-todo-add button{
    border:1px solid var(--indigo-line);background:var(--indigo);color:#fff;
    border-radius:7px;padding:7px 14px;font-size:12.5px;min-height:36px;
  }

  .save{
    position:fixed;bottom:18px;right:24px;
    font-size:11px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);
    padding:6px 12px;border-radius:20px;opacity:0;transition:opacity .3s;
  }
  .save.show{opacity:1;}

  .todo-section{margin-bottom:14px;}
  .todo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer;user-select:none;}
  .todo-head .left{display:flex;align-items:center;gap:6px;}
  .todo-head h2{font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:14px;font-weight:800;letter-spacing:-0.2px;margin:0;}
  .todo-chevron{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;color:var(--ink-soft);
    transition:transform .2s;font-size:11px;
  }
  .todo-chevron.collapsed{transform:rotate(-90deg);}
  .todo-progress{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .todo-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
  .todo-card.collapsed{display:none;}
  .todo-cat-head{margin:10px 0 4px;}
  .todo-cat-head:first-child{margin-top:0;}
  .todo-cat{
    font-family:'Noto Sans KR',sans-serif;
    font-size:11px;font-weight:700;color:var(--indigo);text-transform:uppercase;letter-spacing:0.4px;
  }
  .todo-list{list-style:none;margin:0;padding:0;}
  .todo-list li{
    display:flex;align-items:flex-start;gap:8px;
    padding:5px 0;border-bottom:1px solid var(--line);
  }
  .todo-list li:last-child{border-bottom:none;}
  .todo-list input[type=checkbox]{
    margin-top:2px;width:17px;height:17px;accent-color:var(--indigo);flex-shrink:0;
  }
  .todo-list .txt2{
    flex:1;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.3;
    border-radius:6px;padding:2px 6px;margin:-2px -6px;
  }
  .todo-list .txt2:focus{background:#F5F3EA;}
  .todo-list li.done .txt2{color:var(--ink-soft);text-decoration:line-through;}
  .todo-list .del{
    border:none;background:none;color:#BDBAAE;font-size:15px;padding:2px 6px;min-width:28px;
  }
  .todo-add-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .todo-add-row select{
    font-family:'Noto Sans KR',sans-serif;font-size:13px;
    border:1px solid var(--line);border-radius:8px;padding:8px;
    flex:1 1 100%;
  }
  .todo-add-row input[type=text]{
    font-family:'Noto Sans KR',sans-serif;font-size:14px;flex:1;
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  }
  .todo-add-row button{
    border:1px solid var(--indigo-line);background:var(--indigo);color:#fff;
    border-radius:8px;padding:9px 16px;font-size:13px;min-height:40px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="quicknav" id="quicknav"></div>

  <div class="hero">
    <h1>도쿄 · 홋카이도 여행</h1>
    <p class="sub">2026.08.23 (일) — 08.28 (금) · ANA EF9RIK</p>
    <div class="route">
      <span class="stop">서울</span><span class="arrow">✈</span>
      <span class="stop">도쿄</span><span class="arrow">✈</span>
      <span class="stop">삿포로</span><span class="arrow">🚗</span>
      <span class="stop">비에이·후라노</span><span class="arrow">🚗</span>
      <span class="stop">삿포로</span><span class="arrow">✈</span>
      <span class="stop">도쿄</span><span class="arrow">✈</span>
      <span class="stop">서울</span>
    </div>
  </div>

function formatCost(n, cur){
  const num = Number(n);
  if(isNaN(num)) return '';
  const symbol = cur === 'KRW' ? '₩' : '¥';
  return symbol + num.toLocaleString();
}

async function fetchJpyToKrw(jpyAmount){
  const today = new Date().toISOString().slice(0,10); // 입력일(오늘) 기준
  try{
    const res = await fetch(`https://api.frankfurter.app/${today}?from=JPY&to=KRW`);
    const data = await res.json();
    const rate = data && data.rates && data.rates.KRW;
    if(!rate) return null;
    return { krw: Math.round(jpyAmount * rate), date: today };
  }catch(e){
    console.error('환율 조회 실패', e);
    return null;
  }
}

function calcDayCost(day){
  const cats = { flight:{jpy:0,krw:0}, hotel:{jpy:0,krw:0}, car:{jpy:0,krw:0}, item:{jpy:0,krw:0}, extra:{jpy:0,krw:0} };
  (day.flights||[]).forEach(f=>{
    if(f.cost != null && f.cost !== ''){
      const n = Number(f.cost) || 0;
      if((f.currency||'KRW') === 'JPY') cats.flight.jpy += n; else cats.flight.krw += n;
    }
  });
  if(day.hotel && day.hotel.cost != null && day.hotel.cost !== ''){
    const n = Number(day.hotel.cost) || 0;
    if((day.hotel.currency||'KRW') === 'JPY') cats.hotel.jpy += n; else cats.hotel.krw += n;
  }
  if(day.car && day.car.cost != null && day.car.cost !== ''){
    const n = Number(day.car.cost) || 0;
    if((day.car.currency||'JPY') === 'KRW') cats.car.krw += n; else cats.car.jpy += n;
  }
  (day.items||[]).forEach(it=>{
    if(it.cost != null && it.cost !== ''){
      const n = Number(it.cost) || 0;
      if((it.currency||'JPY') === 'KRW') cats.item.krw += n; else cats.item.jpy += n;
    }
  });
  (day.extraCosts||[]).forEach(ec=>{
    const n = Number(ec.cost) || 0;
    if((ec.currency||'JPY') === 'KRW') cats.extra.krw += n; else cats.extra.jpy += n;
  });
  const jpy = cats.flight.jpy + cats.hotel.jpy + cats.car.jpy + cats.item.jpy + cats.extra.jpy;
  const krw = cats.flight.krw + cats.hotel.krw + cats.car.krw + cats.item.krw + cats.extra.krw;
  return {cats, jpy, krw};
}

function renderCostSummary(){
  applyCostCollapsedState();
  let totalJpy = 0, totalKrw = 0;
  const catGrand = { flight:{jpy:0,krw:0}, hotel:{jpy:0,krw:0}, car:{jpy:0,krw:0}, item:{jpy:0,krw:0}, extra:{jpy:0,krw:0} };
  const catLines = { flight:[], hotel:[], car:[], item:[], extra:[] };

  days.forEach((day, di)=>{
    const {cats, jpy, krw} = calcDayCost(day);
    totalJpy += jpy; totalKrw += krw;
    COST_CAT_META.forEach(m=>{ catGrand[m.key].jpy += cats[m.key].jpy; catGrand[m.key].krw += cats[m.key].krw; });

    (day.flights||[]).forEach(f=>{
      if(f.cost == null || f.cost === '') return;
      catLines.flight.push(`<tr><td class="c-label">Day${day.num} · ${f.badge}</td><td class="c-amt">${formatCost(f.cost, f.currency||'KRW')}</td><td class="c-x"></td></tr>`);
    });
    if(day.hotel && day.hotel.cost != null && day.hotel.cost !== ''){
      const hCur = day.hotel.currency || 'KRW';
      catLines.hotel.push(`<tr><td class="c-label">Day${day.num} · ${day.hotel.name}</td><td class="c-amt">${formatCost(day.hotel.cost, hCur)}</td><td class="c-x"></td></tr>`);

      }

    if(day.car && day.car.cost != null && day.car.cost !== ''){
      catLines.car.push(`<tr><td class="c-label">Day${day.num} · ${day.car.co} (${day.car.event})</td><td class="c-amt">${formatCost(day.car.cost, day.car.currency||'JPY')}</td><td class="c-x"></td></tr>`);
    }
    (day.items||[]).forEach((it)=>{
      if(it.cost == null || it.cost === '') return;
      catLines.item.push(`<tr><td class="c-label">Day${day.num} · ${it.x}</td><td class="c-amt">${formatCost(it.cost, it.currency||'JPY')}</td><td class="c-x"></td></tr>`);
    });

    });
  });

  const totalParts = [];
  if(totalJpy) totalParts.push(formatCost(totalJpy,'JPY'));
  if(totalKrw) totalParts.push(formatCost(totalKrw,'KRW'));

  let catBlocksHtml = '';
  COST_CAT_META.forEach(m=>{
    const c = catGrand[m.key];
    const hasAmount = c.jpy || c.krw;
    const lines = catLines[m.key];
    if(!hasAmount && !lines.length) return; // 해당 카테고리에 아무 내역 없으면 표시 안 함
    const parts = [];
    if(c.jpy) parts.push(formatCost(c.jpy,'JPY'));
    if(c.krw) parts.push(formatCost(c.krw,'KRW'));
    const isOpen = !!costCatOpen[m.key];
    catBlocksHtml += `<div class="cost-cat-block">
      <button class="cost-cat-head" data-cat="${m.key}">
        <span class="cost-cat-title">${m.icon} ${m.label}</span>

      </div>
    </div>`;
  });

  const dayOptions = days.map(d => `<option value="${d.num-1}">Day${d.num} · ${d.date}</option>`).join('');

  costCard.innerHTML = `
    <div class="cost-grand-box">
      <span class="cost-grand-label">전체 합계</span>
      <span class="cost-grand-amt">${totalParts.join(' + ') || '—'}</span>
    </div>
    ${catBlocksHtml || `<div class="cost-empty-day">아직 입력된 비용이 없어요.</div>`}
    <div class="cost-add-section">
      <div class="cost-section-label">🧾 지출 추가</div>
      <div class="cost-add-form">
        <div class="cost-add-row-1">
          <select class="extra-day">${dayOptions}</select>
          <input type="text" class="extra-label" placeholder="항목명 (예: 간식)">
        </div>
        <div class="cost-add-row-2">
          <button class="extra-cur" data-cur="JPY">¥</button>
          <input type="number" class="extra-amount" inputmode="numeric" placeholder="금액">
          <button class="extra-add-btn">추가</button>
        </div>
      </div>
    </div>
  `;

  costCard.querySelectorAll('.cost-cat-head').forEach(el=>{
    el.addEventListener('click', e=>{
      const cat = e.currentTarget.dataset.cat;
      costCatOpen[cat] = !costCatOpen[cat];
      renderCostSummary();
    });
  });
  costCard.querySelectorAll('.del-extra').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day, idx = +e.currentTarget.dataset.idx;
      days[d].extraCosts.splice(idx,1);
      persist();
      renderCostSummary();
    });
  });
  const curBtn = costCard.querySelector('.extra-cur');
  if(curBtn){
    curBtn.addEventListener('click', e=>{
      const btn = e.currentTarget;
      const next = btn.dataset.cur === 'JPY' ? 'KRW' : 'JPY';
      btn.dataset.cur = next;
      btn.textContent = next === 'JPY' ? '¥' : '₩';
    });
  }
  function addExtra(){
    const dayIn = costCard.querySelector('.extra-day');
    const labelIn = costCard.querySelector('.extra-label');
    const amountIn = costCard.querySelector('.extra-amount');
    const curBtnEl = costCard.querySelector('.extra-cur');
    const d = +dayIn.value;
    const label = labelIn.value.trim();
    const amount = amountIn.value.trim();
    if(label && amount){
      if(!days[d].extraCosts) days[d].extraCosts = [];
      days[d].extraCosts.push({label, cost: Number(amount), currency: curBtnEl.dataset.cur});
      costCatOpen.extra = true;
      persist();
      renderCostSummary();
    }
  }
  const addBtn = costCard.querySelector('.extra-add-btn');
  if(addBtn) addBtn.addEventListener('click', addExtra);
  costCard.querySelectorAll('.extra-label, .extra-amount').forEach(el=>{
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); addExtra(); }
    });
  });

  costTotalEl.textContent = totalParts.join(' + ');
}

// Firebase Firestore가 있으면 실시간 동기화, 없으면(오프라인 등)
// Claude 아티팩트의 window.storage 또는 localStorage로 자동 대체
const storageAPI = {
  async get(key, shared=false){
    if(db){
      try{
        const snap = await db.collection('trip').doc(key).get();
        if(snap.exists) return {key, value: snap.data().value, shared};
        return null;
      }catch(e){ console.error('firestore get failed', e); }
    }
    if(window.storage){ return window.storage.get(key, shared); }
    try{
      const v = localStorage.getItem(key);
      return v !== null ? {key, value:v, shared} : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared=false){
    if(db){
      try{
        await db.collection('trip').doc(key).set({value, updatedAt: Date.now()});
        return {key, value, shared};
      }catch(e){ console.error('firestore set failed', e); }
    }
    if(window.storage){ return window.storage.set(key, value, shared); }
    try{
      localStorage.setItem(key, value);
      return {key, value, shared};
    }catch(e){ return null; }
  }
};

function flashSave(){
  saveEl.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveEl.classList.remove('show'),1200);
}

const ITINERARY_VERSION = 7;

async function persist(){
  try{
    await storageAPI.set('itinerary_days', JSON.stringify({version: ITINERARY_VERSION, days}), false);
    flashSave();
  }catch(e){ console.error('save failed', e); }
}

async function loadPersisted(){
  try{
    const res = await storageAPI.get('itinerary_days', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && Array.isArray(parsed.days) && parsed.days.length === days.length){
        parsed.days.forEach((d,i)=>{
          days[i].items = d.items;
          if(Array.isArray(d.dayTodos)) days[i].dayTodos = d.dayTodos;
          if(typeof d.date === 'string') days[i].date = d.date;
          if(typeof d.loc === 'string') days[i].loc = d.loc;
          if(days[i].hotel && d.hotel && d.hotel.cost != null){
            days[i].hotel.cost = d.hotel.cost;
            if(d.hotel.currency) days[i].hotel.currency = d.hotel.currency;
            if(d.hotel.krwEquiv != null) days[i].hotel.krwEquiv = d.hotel.krwEquiv;
            if(d.hotel.krwEquivDate) days[i].hotel.krwEquivDate = d.hotel.krwEquivDate;
          }
          if(Array.isArray(d.extraCosts)) days[i].extraCosts = d.extraCosts;
          if(Array.isArray(d.flights)){
            d.flights.forEach((f,fi)=>{
              if(days[i].flights[fi] && f.cost != null){
                days[i].flights[fi].cost = f.cost;
                if(f.currency) days[i].flights[fi].currency = f.currency;
              }
            });
          }
          if(days[i].car && d.car && d.car.cost != null){
            days[i].car.cost = d.car.cost;
            if(d.car.currency) days[i].car.currency = d.car.currency;
          }
        });
      }
    }
  }catch(e){ /* no saved data yet */ }
}

function renderQuicknav(){
  const nav = document.getElementById('quicknav');
  nav.innerHTML = days.map(day =>
    `<a href="#day-${day.num}" data-day="${day.num}">Day${day.num} ${day.loc.split(/[·→]/)[0].trim()}</a>`
  ).join('');
  nav.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click', e=>{
      const targetEl = document.querySelector(a.getAttribute('href'));
      if(targetEl){
        targetEl.classList.remove('collapsed');
        const di = days.findIndex(d => 'day-' + d.num === targetEl.id);
        if(di >= 0) dayCollapsedState[di] = false;
      }
    });
  });
}

        <input type="checkbox" data-day="${di}" data-tidx="${ti}" ${dt.done?'checked':''}>
        <span class="dtxt" contenteditable="true" data-day="${di}" data-tidx="${ti}">${dt.t}</span>
        <button class="del-dt" data-day="${di}" data-tidx="${ti}" aria-label="삭제">✕</button>
      </li>`;
    });

    el.innerHTML = `
      <div class="day-head" data-toggle="${di}">
        <span class="num-badge">${day.num}</span>
        <div class="titles">
          <h2>Day ${day.num} · <span class="day-date" data-day="${di}">${day.date}</span></h2>
          <div class="loc day-loc" data-day="${di}">${day.loc}</div>
        </div>
        <button class="edit-head-btn" data-day="${di}" title="날짜/이동경로 수정">✏️</button>
        <span class="chevron">▾</span>
      </div>
      <div class="card">
        ${flightsHtml}
        ${flightCostRowsHtml}
        ${hotelHtml}
        ${hotelCostRowHtml}
        ${carHtml}
        ${carCostRowHtml}
        <ul class="list">${itemsHtml}</ul>
        <div class="add-row">
          <input type="text" class="time-in" placeholder="시간" data-day="${di}">
          <input type="text" class="name" placeholder="일정 추가... (장소명도 여기에)" data-day="${di}">
          <button data-day="${di}" class="add-btn">추가</button>
        </div>
        <div class="day-todo">
          <div class="day-todo-title">📌 이 날 해야 할 일</div>
          <ul class="day-todo-list">${dayTodoHtml}</ul>
          <div class="day-todo-add">
            <input type="text" class="dt-new-input" placeholder="할 일 추가..." data-day="${di}">
            <button class="dt-add-btn" data-day="${di}">추가</button>
          </div>
        </div>
      </div>
    `;
    timeline.appendChild(el);
  });

  document.querySelectorAll('.day-head').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('.day-date') || e.target.closest('.day-loc')) return;
      const di = +el.dataset.toggle;
      dayCollapsedState[di] = !dayCollapsedState[di];
      el.closest('.day').classList.toggle('collapsed', dayCollapsedState[di]);
    });
  });

  document.querySelectorAll('.edit-head-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const di = +e.currentTarget.dataset.day;
      const dayEl = document.getElementById('day-' + days[di].num);
      const dateEl = dayEl.querySelector('.day-date');
      const locEl = dayEl.querySelector('.day-loc');
      const nowEditing = dateEl.getAttribute('contenteditable') === 'true';
      if(nowEditing){
        dateEl.removeAttribute('contenteditable');
        locEl.removeAttribute('contenteditable');
      } else {
        dateEl.setAttribute('contenteditable','true');
        locEl.setAttribute('contenteditable','true');
        dateEl.focus();
      }
    });
  });
  document.querySelectorAll('.day-date').forEach(el=>{
    el.addEventListener('click', e=>{ if(el.getAttribute('contenteditable')==='true') e.stopPropagation(); });
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day;
      days[d].date = e.target.textContent.trim();
      e.target.removeAttribute('contenteditable');
      persist();
      renderQuicknav();
    });
  });
  document.querySelectorAll('.day-loc').forEach(el=>{
    el.addEventListener('click', e=>{ if(el.getAttribute('contenteditable')==='true') e.stopPropagation(); });
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day;
      days[d].loc = e.target.textContent.trim();
      e.target.removeAttribute('contenteditable');
      persist();
      renderQuicknav();
    });
  });

  document.querySelectorAll('.txt').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      days[d].items[i].x = e.target.textContent.trim();
      persist();
    });
  });
  document.querySelectorAll('.list .t').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      days[d].items[i].t = e.target.textContent.trim();
      persist();
    });
  });
  document.querySelectorAll('.day-todo-list input[type=checkbox]').forEach(el=>{
    el.addEventListener('change', e=>{
      const d = +e.target.dataset.day, ti = +e.target.dataset.tidx;
      days[d].dayTodos[ti].done = e.target.checked;
      persist();
      render();
    });
  });
  document.querySelectorAll('.dtxt').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, ti = +e.target.dataset.tidx;
      days[d].dayTodos[ti].t = e.target.textContent.trim();
      persist();
    });
  });
  document.querySelectorAll('.del-dt').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day, ti = +e.currentTarget.dataset.tidx;
      days[d].dayTodos.splice(ti,1);
      persist();
      render();
    });
  });
  function addDayTodo(d){
    const input = document.querySelector(`.dt-new-input[data-day="${d}"]`);
    if(input.value.trim()){
      if(!days[d].dayTodos) days[d].dayTodos = [];
      days[d].dayTodos.push({t: input.value.trim(), done:false});
      persist();
      render();
    }
  }
  document.querySelectorAll('.dt-add-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      addDayTodo(+e.currentTarget.dataset.day);
    });
  });
  document.querySelectorAll('.dt-new-input').forEach(el=>{
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); addDayTodo(+e.target.dataset.day); }
    });
  });

  document.querySelectorAll('.more-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const row = e.currentTarget.closest('.item-row').querySelector('.item-more-row');
      const isHidden = row.hidden;
      document.querySelectorAll('.item-more-row').forEach(r=>{ r.hidden = true; });
      row.hidden = !isHidden;
    });
  });
  document.querySelectorAll('.link-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const itemRow = e.currentTarget.closest('.item-row');
      itemRow.querySelector('.item-more-row').hidden = true;
      const linkRow = itemRow.querySelector('.item-link-row');
      linkRow.hidden = false;
      linkRow.querySelector('.link-input').focus();
    });
  });
  document.querySelectorAll('.link-input').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      const val = e.target.value.trim();
      if(val){
        days[d].items[i].url = val;
      } else {
        delete days[d].items[i].url;
      }
      persist();
      render();
    });
  });

  document.querySelectorAll('.move-up').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day, i = +e.currentTarget.dataset.item;
      if(i>0){
        const arr = days[d].items;
        [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
        persist();
        render();
      }
    });
  });
  document.querySelectorAll('.move-down').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day, i = +e.currentTarget.dataset.item;
      const arr = days[d].items;
      if(i<arr.length-1){
        [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
        persist();
        render();
      }
    });
  });
  document.querySelectorAll('.del').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      days[d].items.splice(i,1);
      persist();
      render();
    });
  });
  function addItem(row, d){
    const timeIn = row.querySelector('.time-in');
    const nameIn = row.querySelector('.name');
    if(nameIn.value.trim()){
      days[d].items.push({t: timeIn.value.trim() || '-', x: nameIn.value.trim()});
      persist();
      render();
    }
  }
  document.querySelectorAll('.add-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.target.dataset.day;
      const row = e.target.closest('.add-row');
      addItem(row, d);
    });
  });
  document.querySelectorAll('.add-row .time-in, .add-row .name').forEach(el=>{
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const d = +e.target.dataset.day;
        const row = e.target.closest('.add-row');
        addItem(row, d);
      }
    });
  });
  document.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day;
      const place = e.currentTarget.dataset.place;
      days[d].items.push({t:'-', x: place});
      persist();
      render();
    });
  });

  document.querySelectorAll('.cost-badge').forEach(el=>{
    el.addEventListener('click', e=>{
      const itemRow = e.currentTarget.closest('.item-row');
      const costRow = itemRow.querySelector('.item-cost-row');
      costRow.hidden = false;
      costRow.querySelector('.cost-input').focus();
    });
  });
  document.querySelectorAll('.cost-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      const itemRow = e.currentTarget.closest('.item-row');
      itemRow.querySelector('.item-more-row').hidden = true;
      const costRow = itemRow.querySelector('.item-cost-row');
      costRow.hidden = false;
      costRow.querySelector('.cost-input').focus();
    });
  });
  document.querySelectorAll('.item-cost-row .cost-input').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, i = +e.target.dataset.item;
      const val = e.target.value.trim();
      if(val !== ''){
        days[d].items[i].cost = Number(val);
        if(!days[d].items[i].currency) days[d].items[i].currency = 'JPY';
      } else {
        delete days[d].items[i].cost;
      }
      persist();
      render();
    });
  });
  document.querySelectorAll('.item-cost-row .cost-cur').forEach(el=>{
    el.addEventListener('click', e=>{
      const btn = e.currentTarget;
      const d = +btn.dataset.day, i = +btn.dataset.item;
      const next = btn.dataset.cur === 'JPY' ? 'KRW' : 'JPY';
      btn.dataset.cur = next;
      btn.textContent = next === 'JPY' ? '¥ 엔' : '₩ 원';
      days[d].items[i].currency = next;
      persist();
      renderCostSummary();
    });
  });
  document.querySelectorAll('.hotel-cost-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day;
      const row = document.querySelector(`.hotel-cost-row[data-day="${d}"]`);
      if(row){ row.hidden = false; row.querySelector('.hotel-cost-input').focus(); }
    });
  });
  document.querySelectorAll('.hotel-cost-cur').forEach(el=>{
    el.addEventListener('click', e=>{
      const btn = e.currentTarget;
      const d = +btn.dataset.day;
      const next = btn.dataset.cur === 'JPY' ? 'KRW' : 'JPY';
      btn.dataset.cur = next;
      btn.textContent = next === 'JPY' ? '¥' : '₩';
    });
  });
  document.querySelectorAll('.hotel-cost-input').forEach(el=>{
    el.addEventListener('blur', async e=>{
      const d = +e.target.dataset.day;
      const val = e.target.value.trim();
      const row = e.target.closest('.hotel-cost-row');
      const curBtn = row.querySelector('.hotel-cost-cur');
      const cur = curBtn.dataset.cur;
      if(val !== ''){
        days[d].hotel.cost = Number(val);
        days[d].hotel.currency = cur;
        if(cur === 'JPY'){
          const result = await fetchJpyToKrw(Number(val));
          if(result){
            days[d].hotel.krwEquiv = result.krw;
            days[d].hotel.krwEquivDate = result.date;
          } else {
            delete days[d].hotel.krwEquiv;
            delete days[d].hotel.krwEquivDate;
          }
        } else {
          delete days[d].hotel.krwEquiv;
          delete days[d].hotel.krwEquivDate;
        }
      } else {
        delete days[d].hotel.cost;
        delete days[d].hotel.currency;
        delete days[d].hotel.krwEquiv;
        delete days[d].hotel.krwEquivDate;
      }
      persist();
      render();
    });
  });

  document.querySelectorAll('.flight-cost-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day, fi = +e.currentTarget.dataset.fi;
      const row = document.querySelector(`.flight-cost-row[data-day="${d}"][data-fi="${fi}"]`);
      if(row){ row.hidden = false; row.querySelector('.flight-cost-input').focus(); }
    });
  });
  document.querySelectorAll('.flight-cost-cur').forEach(el=>{
    el.addEventListener('click', e=>{
      const btn = e.currentTarget;
      const next = btn.dataset.cur === 'JPY' ? 'KRW' : 'JPY';
      btn.dataset.cur = next;
      btn.textContent = next === 'JPY' ? '¥' : '₩';
    });
  });
  document.querySelectorAll('.flight-cost-input').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day, fi = +e.target.dataset.fi;
      const val = e.target.value.trim();
      const row = e.target.closest('.flight-cost-row');
      const cur = row.querySelector('.flight-cost-cur').dataset.cur;
      if(val !== ''){
        days[d].flights[fi].cost = Number(val);
        days[d].flights[fi].currency = cur;
      } else {
        delete days[d].flights[fi].cost;
        delete days[d].flights[fi].currency;
      }
      persist();
      render();
    });
  });

  document.querySelectorAll('.car-cost-btn').forEach(el=>{
    el.addEventListener('click', e=>{
      const d = +e.currentTarget.dataset.day;
      const row = document.querySelector(`.car-cost-row[data-day="${d}"]`);
      if(row){ row.hidden = false; row.querySelector('.car-cost-input').focus(); }
    });
  });
  document.querySelectorAll('.car-cost-cur').forEach(el=>{
    el.addEventListener('click', e=>{
      const btn = e.currentTarget;
      const next = btn.dataset.cur === 'JPY' ? 'KRW' : 'JPY';
      btn.dataset.cur = next;
      btn.textContent = next === 'JPY' ? '¥' : '₩';
    });
  });
  document.querySelectorAll('.car-cost-input').forEach(el=>{
    el.addEventListener('blur', e=>{
      const d = +e.target.dataset.day;
      const val = e.target.value.trim();
      const row = e.target.closest('.car-cost-row');
      const cur = row.querySelector('.car-cost-cur').dataset.cur;
      if(val !== ''){
        days[d].car.cost = Number(val);
        days[d].car.currency = cur;
      } else {
        delete days[d].car.cost;
        delete days[d].car.currency;
      }
      persist();
      render();
    });
  });

  renderCostSummary();
}

function setupRealtimeSync(){
  if(!db) return;

  db.collection('trip').doc('itinerary_days').onSnapshot((snap)=>{
    if(!snap.exists) return;
    try{
      const parsed = JSON.parse(snap.data().value);
      if(parsed && Array.isArray(parsed.days) && parsed.days.length === days.length){
        const anyMenuOpen = !!document.querySelector('.item-more-row:not([hidden])');
        if(anyMenuOpen) return; // avoid disrupting an open menu mid-interaction
        parsed.days.forEach((d,i)=>{
          days[i].items = d.items;
          if(Array.isArray(d.dayTodos)) days[i].dayTodos = d.dayTodos;
          if(typeof d.date === 'string') days[i].date = d.date;
          if(typeof d.loc === 'string') days[i].loc = d.loc;
          if(days[i].hotel && d.hotel && d.hotel.cost != null){
            days[i].hotel.cost = d.hotel.cost;
            if(d.hotel.currency) days[i].hotel.currency = d.hotel.currency;
            if(d.hotel.krwEquiv != null) days[i].hotel.krwEquiv = d.hotel.krwEquiv;
            if(d.hotel.krwEquivDate) days[i].hotel.krwEquivDate = d.hotel.krwEquivDate;
          }
          if(Array.isArray(d.extraCosts)) days[i].extraCosts = d.extraCosts;
          if(Array.isArray(d.flights)){
            d.flights.forEach((f,fi)=>{
              if(days[i].flights[fi] && f.cost != null){
                days[i].flights[fi].cost = f.cost;
                if(f.currency) days[i].flights[fi].currency = f.currency;
              }
            });
          }
          if(days[i].car && d.car && d.car.cost != null){
            days[i].car.cost = d.car.cost;
            if(d.car.currency) days[i].car.currency = d.car.currency;
          }
        });
        render();
        renderQuicknav();
      }
    }catch(e){ /* ignore malformed remote data */ }
  });

  db.collection('trip').doc('itinerary_todos').onSnapshot((snap)=>{
    if(!snap.exists) return;
    try{
      const parsed = JSON.parse(snap.data().value);
      if(parsed && Array.isArray(parsed.items) && Array.isArray(parsed.categories)){
        todos = parsed.items;
        todoCategories = parsed.categories;
        todoCollapsed = !!parsed.collapsed;
        renderTodos();
      }
    }catch(e){ /* ignore malformed remote data */ }
  });
}

document.addEventListener('click', ()=>{
  document.querySelectorAll('.item-more-row').forEach(r=>{ r.hidden = true; });
});

(async ()=>{
  await loadPersisted();
  render();
  renderQuicknav();
  await loadTodos();
  renderTodos();
  setupRealtimeSync();
})();
</script>
</body>
</html>
